[package]
name = "survey-io"
description = "Import/export of survey interchange formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
survey-core.workspace = true
glam.workspace = true
csv.workspace = true
quick-xml.workspace = true
serde.workspace = true
thiserror.workspace = true
miniz_oxide.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# COPC reading is native only (no filesystem/decoder path on wasm).
copc-rs.workspace = true
# Pins the shared laz version so copc-rs 0.5.0 builds (see workspace Cargo.toml).
las.workspace = true
laz.workspace = true
