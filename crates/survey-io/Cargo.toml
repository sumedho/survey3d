[package]
name = "survey-io"
description = "Import/export of survey interchange formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
survey-core.workspace = true
glam.workspace = true
csv.workspace = true
quick-xml.workspace = true
serde.workspace = true
thiserror.workspace = true
miniz_oxide.workspace = true
tiff.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# COPC reading and writing are native only (no filesystem/decoder path on wasm).
las.workspace = true
laz.workspace = true
fs4.workspace = true
# Imagery: tile caches and image decoding.
rusqlite = { workspace = true, features = ["bundled"] }
image.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# An independent COPC reader, to check what the writer produces.
copc-rs.workspace = true
